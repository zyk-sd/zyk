# ============================================================
# 服务端配置
# ============================================================
server.port=8080
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# ============================================================
# H2 文件数据库配置（数据保存在项目根目录的 data 文件夹中）
# 无需额外安装 MySQL，重启后数据依然存在
# ============================================================
spring.datasource.url=jdbc:h2:file:./data/game_companion;MODE=MySQL;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ============================================================
# JPA / Hibernate 配置
# ============================================================
# update：表结构自动创建与更新，适合教学演示
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# H2 网页控制台（可选）：http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ============================================================
# Thymeleaf 模板配置（关闭缓存，改页面后刷新即可生效）
# ============================================================
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# 日志级别
logging.level.org.hibernate.SQL=warn
